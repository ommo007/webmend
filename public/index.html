<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>webmend — self-healing scraper ops</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --bg: #0b1020; --panel: #131a2e; --panel-2: #1a2340; --border: #2a3358;
    --text: #e6e9f5; --muted: #8b93b8; --ok: #34d399; --healed: #60a5fa;
    --failed: #f87171; --accent: #a78bfa;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--text); padding: 32px 24px 64px;
  }
  header { max-width: 1100px; margin: 0 auto 28px; }
  header h1 { margin: 0 0 4px; font-size: 1.6em; }
  header h1 span { color: var(--accent); }
  header p { margin: 0; color: var(--muted); font-size: 0.95em; }
  main { max-width: 1100px; margin: 0 auto; display: grid; gap: 20px; grid-template-columns: 1.3fr 1fr; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; }
  .panel h2 { margin: 0 0 14px; font-size: 1em; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .target-card {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px; margin-bottom: 12px;
  }
  .target-card:last-child { margin-bottom: 0; }
  .target-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .target-name { font-weight: 600; }
  .target-url { color: var(--muted); font-size: 0.8em; word-break: break-all; }
  .badge {
    display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 0.75em;
    font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em;
  }
  .badge.ok { background: rgba(52,211,153,0.15); color: var(--ok); }
  .badge.healed { background: rgba(96,165,250,0.15); color: var(--healed); }
  .badge.failed { background: rgba(248,113,113,0.15); color: var(--failed); }
  .badge.none { background: rgba(139,147,184,0.15); color: var(--muted); }
  .meta { color: var(--muted); font-size: 0.8em; margin-top: 6px; }
  .collector-id { font-family: ui-monospace, monospace; font-size: 0.75em; color: var(--muted); }
  .heal-event {
    border-left: 3px solid var(--healed); padding: 8px 12px; margin-bottom: 10px; background: var(--panel-2);
    border-radius: 0 8px 8px 0; font-size: 0.85em;
  }
  .heal-event.failed { border-left-color: var(--failed); }
  .heal-event .when { color: var(--muted); font-size: 0.8em; }
  .heal-event .reason { margin: 4px 0; }
  .empty { color: var(--muted); font-size: 0.9em; padding: 8px 0; }
</style>
</head>
<body>
<header>
  <h1><span>webmend</span> — self-healing scraper ops</h1>
  <p>Live view of Bright Data Scraper Studio collectors: run status, record counts, and self-heal events.</p>
</header>
<main>
  <section class="panel">
    <h2>Tracked targets</h2>
    <div id="targets"></div>
  </section>
  <section class="panel">
    <h2>Self-heal event feed</h2>
    <div id="heals"></div>
  </section>
</main>

<script>
function badgeClass(status) {
  if (!status) return "none";
  if (status === "ok") return "ok";
  if (status === "healed") return "healed";
  return "failed";
}

function renderTargets(targets) {
  const el = document.getElementById("targets");
  if (targets.length === 0) {
    el.innerHTML = '<div class="empty">No targets tracked yet. Run `webmend add`.</div>';
    return;
  }
  el.innerHTML = targets.map((t) => {
    const run = t.latestRun;
    const status = run ? run.status : null;
    return `
      <div class="target-card">
        <div class="target-row">
          <span class="target-name">${t.name}</span>
          <span class="badge ${badgeClass(status)}">${status ?? "never run"}</span>
        </div>
        <div class="target-url">${t.url}</div>
        <div class="meta">
          collector_id: <span class="collector-id">${t.collectorId}</span><br/>
          ${run ? `${run.record_count ?? "?"} records &middot; ${run.created_at}` : "no runs yet"}
        </div>
      </div>`;
  }).join("");
}

function renderHeals(events) {
  const el = document.getElementById("heals");
  if (events.length === 0) {
    el.innerHTML = '<div class="empty">No heal events yet.</div>';
    return;
  }
  el.innerHTML = events.map((h) => `
    <div class="heal-event ${h.heal_status === 'success' ? '' : 'failed'}">
      <div class="when">${h.created_at} &middot; ${h.target_name} &middot; ${h.heal_status.toUpperCase()}</div>
      <div class="reason">${h.reason}</div>
    </div>`).join("");
}

async function refresh() {
  try {
    const res = await fetch("/api/status");
    const data = await res.json();
    renderTargets(data.targets);
    renderHeals(data.healEvents);
  } catch (err) {
    console.error("refresh failed", err);
  }
}

refresh();
setInterval(refresh, 4000);
</script>
</body>
</html>
